version: '3.8'

services:
  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    ports:
      - "8080:8080"
    environment:
      # Auth & Encryption (gere chaves fortes em produção!)
      - AUTH_SECRET=${AUTH_SECRET:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-in-production-32-chars}
      # Database - Infisical usa DB_CONNECTION_URI ou variáveis individuais DB_*
      - DB_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/infisical
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=infisical
      # Redis (obrigatório)
      - REDIS_URL=redis://redis:6379
      # Opcional: email (para convites, reset de senha)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-noreply@localhost}
      - SMTP_TLS=${SMTP_TLS:-true}
      # Opcional: OAuth (GitHub, GitLab, Google, etc)
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID:-}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET:-}
      - AUTH_GITLAB_CLIENT_ID=${AUTH_GITLAB_CLIENT_ID:-}
      - AUTH_GITLAB_CLIENT_SECRET=${AUTH_GITLAB_CLIENT_SECRET:-}
      - AUTH_GOOGLE_CLIENT_ID=${AUTH_GOOGLE_CLIENT_ID:-}
      - AUTH_GOOGLE_CLIENT_SECRET=${AUTH_GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080' && echo OK"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - infisical-network

  db:
    image: postgres:16-alpine
    container_name: infisical-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=infisical
    volumes:
      - infisical-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infisical"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - infisical-network

  redis:
    image: redis:7-alpine
    container_name: infisical-redis
    command: redis-server --appendonly yes
    volumes:
      - infisical-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - infisical-network

volumes:
  infisical-db-data:
  infisical-redis-data:

networks:
  infisical-network:
    driver: bridge